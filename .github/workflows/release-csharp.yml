name: Release C# BarTender Printer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test BarTenderPrinter.Tests/BarTenderPrinter.Tests.csproj -c Release

      - name: Publish self-contained application
        run: dotnet publish BarTenderPrinter/BarTenderPrinter.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "installer/BarTenderPrinter.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "installer-output/BarTenderPrinter-Setup-*-win-x64.exe" | Select-Object -First 1
          if (!$installer -or $installer.Length -le 0) {
            throw "Installer was not generated"
          }
          $releaseInstaller = "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe"
          Move-Item $installer.FullName $releaseInstaller -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe"
          body: |
            ## BarTender 标签打印工具 ${{ steps.version.outputs.VERSION }}

            ### 更新内容

            #### 修复与优化
            - JSONL 历史加载支持坏行隔离，损坏记录写入 .bad 文件并继续加载
            - JSONL 为空时自动回退 CSV 历史并迁移，降低历史隐藏风险
            - 历史记录追加写入 RecordChecksum，加载时校验记录完整性
            - 历史筛选分页下推到 HistoryManager，减少 UI 层全量筛选
            - HistoryManager、OrderManager、TemplateSettingsManager 支持自定义路径，测试使用临时目录隔离
            - 增加 JSONL 损坏行、CSV 迁移和历史测试隔离用例
            - 补打印前检测历史模板版本与当前模板版本差异，并要求确认

            ### 系统要求
            - Windows 10/11 x64
            - .NET 8.0 运行时（已内置，无需额外安装）
            - BarTender 2022 R2 Enterprise 或更高版本

            ### 安装说明
            1. 下载 `BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe`
            2. 运行安装向导
            3. 从开始菜单或桌面快捷方式启动软件

            ### 文件信息
            - 文件名: BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe
            - 架构: win-x64
            - 类型: 当前用户范围自包含安装包
          generate_release_notes: false
          draft: false
          prerelease: false
