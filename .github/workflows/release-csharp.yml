name: Release C# BarTender Printer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained application
        run: dotnet publish BarTenderPrinter/BarTenderPrinter.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "installer/BarTenderPrinter.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "installer-output/BarTenderPrinter-Setup-*-win-x64.exe" | Select-Object -First 1
          if (!$installer -or $installer.Length -le 0) {
            throw "Installer was not generated"
          }
          $releaseInstaller = "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe"
          Move-Item $installer.FullName $releaseInstaller -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe"
          body: |
            ## BarTender 标签打印工具 ${{ steps.version.outputs.VERSION }}

            ### 更新内容

            #### 修复与优化
            - 本地完整匹配支持绑定具体数据源字段，避免所有字段共用同一校验集合
            - 历史记录新增稳定模板 ID，重复校验优先按模板 ID 命中，旧记录按路径兼容
            - 历史导入到增降序锁定字段时同步 LockedValue 和 AutoIncrementLocked 状态
            - INI 配置改为临时文件原子替换保存，降低半更新配置风险
            - INI 持久化 LengthEdited，重启后保留单项长度语义
            - 本地校验 CSV 与历史 CSV 共用统一解析工具，支持双引号转义
            - 历史加载改为流式读取，历史页面默认展示最近 2000 条并优化统计计数

            ### 系统要求
            - Windows 10/11 x64
            - .NET 8.0 运行时（已内置，无需额外安装）
            - BarTender 2022 R2 Enterprise 或更高版本

            ### 安装说明
            1. 下载 `BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe`
            2. 运行安装向导
            3. 从开始菜单或桌面快捷方式启动软件

            ### 文件信息
            - 文件名: BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe
            - 架构: win-x64
            - 类型: 当前用户范围自包含安装包
          generate_release_notes: false
          draft: false
          prerelease: false
