name: Release C# BarTender Printer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix, for example 5.7.80'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $semver = '${{ inputs.version }}'
            if ($semver -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $semver" }
            $tag = "v$semver"
          } else {
            $tag = '${{ github.ref_name }}'
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
            $semver = $tag.Substring(1)
          }
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "SEMVER=$semver" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: dotnet test BarTenderPrinter.Tests/BarTenderPrinter.Tests.csproj -c Release

      - name: Publish self-contained application
        run: dotnet publish BarTenderPrinter/BarTenderPrinter.csproj -c Release -r win-x64 --self-contained true -o publish -p:Version=${{ steps.version.outputs.SEMVER }} -p:AssemblyVersion=${{ steps.version.outputs.SEMVER }}.0 -p:FileVersion=${{ steps.version.outputs.SEMVER }}.0

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.SEMVER }}" "installer/BarTenderPrinter.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $releaseInstaller = "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe"
          $installer = Get-Item $releaseInstaller -ErrorAction SilentlyContinue
          if (!$installer -or $installer.Length -le 0) {
            throw "Installer was not generated"
          }
          $exeVersion = (Get-Item "publish/BarTenderPrinter.exe").VersionInfo.ProductVersion
          if (!$exeVersion.StartsWith("${{ steps.version.outputs.SEMVER }}")) {
            throw "EXE version $exeVersion does not match ${{ steps.version.outputs.SEMVER }}"
          }
          if (!(Test-Path "publish/BarTenderPreviewHost.exe")) {
            throw "BarTenderPreviewHost.exe is missing from publish output"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe"
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          body: |
            ## BarTender 标签打印工具 ${{ steps.version.outputs.TAG }}

            ### 更新内容

            #### 账户与补打印安全
            - 初始管理员使用随机启动密码，账户密码升级为 PBKDF2-SHA256 存储
            - 补打印增加 Supervisor/Admin 登录、原因记录和打印机可用性校验
            - 打印前校验模板文件、打印机和打印份数

            #### 历史与文件可靠性
            - 打印历史和审计记录增加 HMAC-SHA256 完整性校验
            - 历史独立副本迁移到用户数据目录，主存储成功后归档异常降级为日志告警
            - 原子文件写入增加跨进程互斥、遗弃锁恢复和唯一临时文件
            - CSV 导出增加公式注入防护，日志增加换行净化和自动轮转

            #### 预览与交互
            - 预览字段名称改为大小写无关匹配，并兼容旧版 BarTender 缩略图 API
            - 打印与补打印仅在订单、模板和字段上下文一致时刷新预览
            - 过期校验数据导入结果自动丢弃，无效订单筛选组合自动清空

            #### 测试与发布
            - CI 覆盖主分支和 Pull Request 构建、核心测试与安装包版本校验

            ### 系统要求
            - Windows 10/11 x64
            - .NET 8.0 运行时（已内置，无需额外安装）
            - BarTender 2022 R2 Automation 或 Enterprise x64

            ### 安装说明
            1. 下载 `BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe`
            2. 运行安装向导
            3. 从开始菜单或桌面快捷方式启动软件

            ### 文件信息
            - 文件名: BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe
            - 架构: win-x64
            - 类型: 当前用户范围自包含安装包
          generate_release_notes: false
          draft: false
          prerelease: false
