name: Release C# BarTender Printer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test BarTenderPrinter.Tests/BarTenderPrinter.Tests.csproj -c Release

      - name: Publish self-contained application
        run: dotnet publish BarTenderPrinter/BarTenderPrinter.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "installer/BarTenderPrinter.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "installer-output/BarTenderPrinter-Setup-*-win-x64.exe" | Select-Object -First 1
          if (!$installer -or $installer.Length -le 0) {
            throw "Installer was not generated"
          }
          $releaseInstaller = "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe"
          Move-Item $installer.FullName $releaseInstaller -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe"
          body: |
            ## BarTender 标签打印工具 ${{ steps.version.outputs.VERSION }}

            ### 更新内容

            #### 修复与优化
            - 旧版全局数据源配置按当前模板字段静默迁移，模板加载不再自动弹出旧数据源设置窗口
            - 自动字段读取支持请求淘汰，快速切换模板时只应用最后一次结果
            - 单条历史删除改为非破坏排除，记录退出界面、重复校验和业务检测，原始数据持续保留
            - 清空记录改为带权限和高风险提示的清空控件操作，按批次排除当前模板活动历史
            - 每条打印历史按日期和 RecordId 保存独立 JSON 副本到程序目录 history-records
            - SQLite 增加旧存储迁移完成标记，合法空库不再重新导入旧 CSV
            - 修复旧订单 ID、Schema 和作用域迁移结果未及时落盘的问题

            ### 系统要求
            - Windows 10/11 x64
            - .NET 8.0 运行时（已内置，无需额外安装）
            - BarTender 2022 R2 Automation 或 Enterprise x64

            ### 安装说明
            1. 下载 `BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe`
            2. 运行安装向导
            3. 从开始菜单或桌面快捷方式启动软件

            ### 文件信息
            - 文件名: BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe
            - 架构: win-x64
            - 类型: 当前用户范围自包含安装包
          generate_release_notes: false
          draft: false
          prerelease: false
