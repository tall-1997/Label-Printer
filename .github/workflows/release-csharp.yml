name: Release C# BarTender Printer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix, for example 5.7.84'
        required: true
        type: string

concurrency:
  group: release-csharp
  cancel-in-progress: false

jobs:
  test-linux-service:
    name: Linux center service and cross-platform tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: bartender_ci
          POSTGRES_USER: bartender_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bartender_ci -d bartender_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BARTENDER_TEST_POSTGRES: Host=localhost;Port=5432;Database=bartender_ci;Username=bartender_ci
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run cross-platform tests
        shell: bash
        run: |
          dotnet test BarTenderPrinter.Domain.Tests/BarTenderPrinter.Domain.Tests.csproj -c Release
          dotnet test BarTenderPrinter.Devices.Tests/BarTenderPrinter.Devices.Tests.csproj -c Release
          dotnet test BarTenderPrinter.Printing.Tests/BarTenderPrinter.Printing.Tests.csproj -c Release
          dotnet test BarTenderPrinter.MesClient.Tests/BarTenderPrinter.MesClient.Tests.csproj -c Release
          dotnet test BarTenderPrinter.Persistence.Tests/BarTenderPrinter.Persistence.Tests.csproj -c Release
          dotnet test BarTenderPrinter.MesApi.Tests/BarTenderPrinter.MesApi.Tests.csproj -c Release

      - name: Build center service
        run: dotnet build BarTenderPrinter.MesApi/BarTenderPrinter.MesApi.csproj -c Release

  build-and-release:
    name: Windows WinForms and BarTender release
    needs: test-linux-service
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_EVENT_NAME -eq 'workflow_dispatch') {
            $semver = $env:RELEASE_INPUT_VERSION
            if ($semver -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $semver" }
            $tag = "v$semver"
          } else {
            $tag = $env:RELEASE_REF_NAME
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
            $semver = $tag.Substring(1)
          }
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "SEMVER=$semver" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: dotnet test BarTenderPrinter.Tests/BarTenderPrinter.Tests.csproj -c Release

      - name: Publish self-contained application
        run: dotnet publish BarTenderPrinter/BarTenderPrinter.csproj -c Release -r win-x64 --self-contained true -o publish -p:Version=${{ steps.version.outputs.SEMVER }} -p:AssemblyVersion=${{ steps.version.outputs.SEMVER }}.0 -p:FileVersion=${{ steps.version.outputs.SEMVER }}.0

      - name: Verify release artifact contents
        shell: pwsh
        run: ./scripts/Test-ReleaseArtifact.ps1 -PublishDirectory publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.SEMVER }}" "installer/BarTenderPrinter.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $releaseInstaller = "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe"
          $installer = Get-Item $releaseInstaller -ErrorAction SilentlyContinue
          if (!$installer -or $installer.Length -le 0) {
            throw "Installer was not generated"
          }
          $fileVersion = (Get-Item "publish/BarTenderPrinter.exe").VersionInfo.FileVersion
          if ($fileVersion -ne "${{ steps.version.outputs.SEMVER }}.0") {
            throw "EXE file version $fileVersion does not match ${{ steps.version.outputs.SEMVER }}.0"
          }
          if (!(Test-Path "publish/BarTenderPreviewHost.exe")) {
            throw "BarTenderPreviewHost.exe is missing from publish output"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe"
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          body: |
            ## BarTender 标签打印工具 ${{ steps.version.outputs.TAG }}

            ### 更新内容

            #### MES 工位
            - 新增订单、组装过站、包装过站、中心打印、追溯和人工核查页面
            - 支持断线任务保留、幂等领取与回执恢复、关联 ID 和敏感日志脱敏
            - 中心打印严格使用不可变模板、打印机和字段快照

            #### 制造与设备
            - 新增订单号段、制造路线、四级包装和统一生产追溯
            - 提供模拟电子称稳定读数和模拟 IMEI/SN 写入回读校验
            - 本地 SQLite 打印账本在 BarTender 提交前保存不可变作业快照

            #### 质量与仓储
            - 新增质量抽检、冻结处置、返工审批和受控返工路线
            - 新增出库扫描、数量确认和订单不可变归档
            - PostgreSQL v9 提供事务审计、并发幂等和历史数据修复迁移

            #### 测试与发布
            - Linux CI 验证领域、设备、打印、客户端、PostgreSQL 和 MES API
            - Windows CI 验证 WinForms、BarTender 边界、自包含发布和安装包内容
            - 发布制品自动排除旧 MobileMes 资产、证书、数据库、日志和敏感配置

            ### 系统要求
            - Windows 10/11 x64
            - .NET 8.0 运行时（已内置，无需额外安装）
            - BarTender 2022 R2 Automation 或 Enterprise x64

            ### 安装说明
            1. 下载 `BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe`
            2. 运行安装向导
            3. 从开始菜单或桌面快捷方式启动软件

            ### 文件信息
            - 文件名: BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe
            - 架构: win-x64
            - 类型: 当前用户范围自包含安装包
          generate_release_notes: false
          draft: false
          prerelease: false
