name: Release C# BarTender Printer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test BarTenderPrinter.Tests/BarTenderPrinter.Tests.csproj -c Release

      - name: Publish self-contained application
        run: dotnet publish BarTenderPrinter/BarTenderPrinter.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "installer/BarTenderPrinter.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "installer-output/BarTenderPrinter-Setup-*-win-x64.exe" | Select-Object -First 1
          if (!$installer -or $installer.Length -le 0) {
            throw "Installer was not generated"
          }
          $releaseInstaller = "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe"
          Move-Item $installer.FullName $releaseInstaller -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe"
          body: |
            ## BarTender 标签打印工具 ${{ steps.version.outputs.VERSION }}

            ### 更新内容

            #### 修复与优化
            - 原模板预览使用 `LabelFormatThumbnail.Create` 生成 1200×1200 白底缩略图
            - 最近成功打印记录使用 `SubStrings.SetSubString` 和 `ExportImageToFile` 生成动态字段预览
            - 启动时验证缩略图、字段赋值和图片导出 API 签名
            - 优先展示当前模板最近一次 PASS 或 REPRINT_PASS 的字段效果
            - 当前模板缺少成功记录时展示原模板预览
            - 打印队列处理期间延后预览，避免干扰 FIFO 连续打印
            - 预览失败时清除旧图片，避免显示过期标签内容

            ### 系统要求
            - Windows 10/11 x64
            - .NET 8.0 运行时（已内置，无需额外安装）
            - BarTender 2022 R2 Automation 或 Enterprise x64

            ### 安装说明
            1. 下载 `BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe`
            2. 运行安装向导
            3. 从开始菜单或桌面快捷方式启动软件

            ### 文件信息
            - 文件名: BarTenderPrinter-Setup-${{ steps.version.outputs.VERSION }}-win-x64.exe
            - 架构: win-x64
            - 类型: 当前用户范围自包含安装包
          generate_release_notes: false
          draft: false
          prerelease: false
