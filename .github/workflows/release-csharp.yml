name: Release C# BarTender Printer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix, for example 5.7.92'
        required: true
        type: string

concurrency:
  group: release-csharp
  cancel-in-progress: false

jobs:
  test-linux-service:
    name: Linux center service and cross-platform tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bartender_ci
          POSTGRES_USER: bartender_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bartender_ci -d bartender_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BARTENDER_TEST_POSTGRES: Host=localhost;Port=5432;Database=bartender_ci;Username=bartender_ci
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MES Web toolchain
        shell: bash
        run: |
          npm install -g react@19.1.1 react-dom@19.1.1 react-router-dom@7.18.2 @mui/material@7.3.2 @mui/icons-material@7.3.2 @emotion/react@11.14.0 @emotion/styled@11.14.1 typescript@5.9.2 vite@7.1.5 @vitejs/plugin-react@5.0.2 vitest@3.2.4 jsdom@26.1.0 @testing-library/react@16.3.0 @testing-library/jest-dom@6.8.0 @types/react@19.1.12 @types/react-dom@19.1.9
          ln -s "$(npm root -g)" BarTenderPrinter.MesWeb/node_modules

      - name: Test and build MES Web
        shell: bash
        run: |
          npm --prefix BarTenderPrinter.MesWeb test
          npm --prefix BarTenderPrinter.MesWeb run build

      - name: Run cross-platform tests
        shell: bash
        run: |
          dotnet test BarTenderPrinter.Domain.Tests/BarTenderPrinter.Domain.Tests.csproj -c Release
          dotnet test BarTenderPrinter.Application.Tests/BarTenderPrinter.Application.Tests.csproj -c Release
          dotnet test BarTenderPrinter.StationAgent.Tests/BarTenderPrinter.StationAgent.Tests.csproj -c Release
          dotnet test BarTenderPrinter.Devices.Tests/BarTenderPrinter.Devices.Tests.csproj -c Release
          dotnet test BarTenderPrinter.Printing.Tests/BarTenderPrinter.Printing.Tests.csproj -c Release
          dotnet test BarTenderPrinter.MesClient.Tests/BarTenderPrinter.MesClient.Tests.csproj -c Release
          dotnet test BarTenderPrinter.Persistence.Tests/BarTenderPrinter.Persistence.Tests.csproj -c Release
          dotnet test BarTenderPrinter.MesApi.Tests/BarTenderPrinter.MesApi.Tests.csproj -c Release

      - name: Build center service
        run: |
          dotnet build BarTenderPrinter.MesApi/BarTenderPrinter.MesApi.csproj -c Release
          dotnet build BarTenderPrinter.StationAgent/BarTenderPrinter.StationAgent.csproj -c Release

  build-and-release:
    name: Windows WinForms and BarTender release
    needs: test-linux-service
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_EVENT_NAME -eq 'workflow_dispatch') {
            $semver = $env:RELEASE_INPUT_VERSION
            if ($semver -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $semver" }
            $tag = "v$semver"
          } else {
            $tag = $env:RELEASE_REF_NAME
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
            $semver = $tag.Substring(1)
          }
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "SEMVER=$semver" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: dotnet test BarTenderPrinter.Tests/BarTenderPrinter.Tests.csproj -c Release

      - name: Publish self-contained application
        run: dotnet publish BarTenderPrinter/BarTenderPrinter.csproj -c Release -r win-x64 --self-contained true -o publish -p:Version=${{ steps.version.outputs.SEMVER }} -p:AssemblyVersion=${{ steps.version.outputs.SEMVER }}.0 -p:FileVersion=${{ steps.version.outputs.SEMVER }}.0

      - name: Verify release artifact contents
        shell: pwsh
        run: ./scripts/Test-ReleaseArtifact.ps1 -PublishDirectory publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.SEMVER }}" "installer/BarTenderPrinter.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $releaseInstaller = "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe"
          $installer = Get-Item $releaseInstaller -ErrorAction SilentlyContinue
          if (!$installer -or $installer.Length -le 0) {
            throw "Installer was not generated"
          }
          $fileVersion = (Get-Item "publish/BarTenderPrinter.exe").VersionInfo.FileVersion
          if ($fileVersion -ne "${{ steps.version.outputs.SEMVER }}.0") {
            throw "EXE file version $fileVersion does not match ${{ steps.version.outputs.SEMVER }}.0"
          }
          if (!(Test-Path "publish/BarTenderPreviewHost.exe")) {
            throw "BarTenderPreviewHost.exe is missing from publish output"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe"
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          body: |
            ## BarTender 标签打印工具 ${{ steps.version.outputs.TAG }}

            ### 更新内容

            #### MES Web 平台
            - 新增 React 19、TypeScript、Vite 和 MUI 响应式管理端及扫码工位端
            - 提供明暗主题、Capability 导航、实时追溯、页面状态恢复和同源生产托管
            - `/api/v1` 与迁移期 `/api` 共用业务处理、授权、幂等和审计逻辑

            #### 应用与设备架构
            - 新增 Application 用例层，集中平台会话、Capability、规范请求摘要和审计清洗
            - 新增 loopback Station Agent，隔离 BarTender、打印机、电子秤、写号工具和本地 SQLite
            - 本地操作账本支持幂等重放、乐观并发、崩溃不确定状态、人工恢复和离线 outbox

            #### 数据与契约
            - PostgreSQL 保持中心权威存储，号码状态规则集中到 Domain 层
            - 统一 `Idempotency-Key` 请求头、正文一致性校验及规范 JSON SHA-256 摘要
            - 提供 OpenAPI v1 基线和 TypeScript 合约，迁移版本增加连续性校验

            #### 安全与合规
            - 保留认证、角色授权、Capability、审计完整性和输入验证边界
            - IMEI、SN 和设备诊断在审计快照中脱敏或转换为摘要
            - 发布制品排除 HASP、Sentinel、旧 MobileMes 资产、证书、数据库和日志

            #### 测试与发布
            - Linux CI 验证 192 项领域、应用、设备、打印、客户端、PostgreSQL、MES API 和 Agent 测试
            - Web CI 验证 Vitest、TypeScript 和 Vite 生产构建
            - Windows CI 验证 WinForms、BarTender 边界、自包含发布和安装包内容
            - 发布制品自动扫描敏感配置和非授权运行时资产

            ### 系统要求
            - Windows 10/11 x64
            - .NET 8.0 运行时（已内置，无需额外安装）
            - BarTender 2022 R2 Automation 或 Enterprise x64

            ### 安装说明
            1. 下载 `BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe`
            2. 运行安装向导
            3. 从开始菜单或桌面快捷方式启动软件

            ### 文件信息
            - 文件名: BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe
            - 架构: win-x64
            - 类型: 当前用户范围自包含安装包
          generate_release_notes: false
          draft: false
          prerelease: false
