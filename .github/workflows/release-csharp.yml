name: Release C# BarTender Printer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix, for example 5.7.94'
        required: true
        type: string

concurrency:
  group: release-csharp
  cancel-in-progress: false

jobs:
  test-printing-core:
    name: Linux printing reliability tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run printing reliability tests
        run: dotnet test BarTenderPrinter.Printing.Tests/BarTenderPrinter.Printing.Tests.csproj -c Release

  build-and-release:
    name: Windows WinForms and BarTender release
    needs: test-printing-core
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_EVENT_NAME -eq 'workflow_dispatch') {
            $semver = $env:RELEASE_INPUT_VERSION
            if ($semver -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $semver" }
            $tag = "v$semver"
          } else {
            $tag = $env:RELEASE_REF_NAME
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $tag" }
            $semver = $tag.Substring(1)
          }
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "SEMVER=$semver" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: dotnet test BarTenderPrinter.Tests/BarTenderPrinter.Tests.csproj -c Release --logger "trx;LogFileName=release-windows.trx" --results-directory TestResults

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-csharp-windows-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Publish self-contained application
        run: dotnet publish BarTenderPrinter/BarTenderPrinter.csproj -c Release -r win-x64 --self-contained true -o publish -p:Version=${{ steps.version.outputs.SEMVER }} -p:AssemblyVersion=${{ steps.version.outputs.SEMVER }}.0 -p:FileVersion=${{ steps.version.outputs.SEMVER }}.0

      - name: Verify release artifact contents
        shell: pwsh
        run: ./scripts/Test-ReleaseArtifact.ps1 -PublishDirectory publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.SEMVER }}" "installer/BarTenderPrinter.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $releaseInstaller = "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe"
          $installer = Get-Item $releaseInstaller -ErrorAction SilentlyContinue
          if (!$installer -or $installer.Length -le 0) {
            throw "Installer was not generated"
          }
          $fileVersion = (Get-Item "publish/BarTenderPrinter.exe").VersionInfo.FileVersion
          if ($fileVersion -ne "${{ steps.version.outputs.SEMVER }}.0") {
            throw "EXE file version $fileVersion does not match ${{ steps.version.outputs.SEMVER }}.0"
          }
          if (!(Test-Path "publish/BarTenderPreviewHost.exe")) {
            throw "BarTenderPreviewHost.exe is missing from publish output"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "installer-output/BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe"
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          body: |
            ## BarTender 标签打印工具 ${{ steps.version.outputs.TAG }}

            ### 更新内容

            #### 加密协作同步
            - 新增坚果云 WebDAV 协作空间及 `.btpsync` 加密连接文件
            - 同步订单、模板设置、模板文件、打印历史、作业状态和补打印审计
            - 使用 AES-256-GCM 加密云端对象，并使用 Windows DPAPI 保护本地凭据和密钥
            - 支持持久化 outbox、连续游标、冲突决议、损坏对象隔离、退避重试和加密快照

            #### 同步中心与专网直连
            - 新增与打印页面、订单管理同级的同步中心
            - 展示设备、待上传事件、冲突、流量、近期活动和脱敏诊断
            - 支持 TLS 专网直连、加密设备端点交换和 WebDAV 自动回退
            - 支持启动、保存后防抖、网络恢复、手动操作和退出前按需同步

            #### 打印可靠性
            - 保留 SQLite 打印作业账本、幂等防重和并发重复提交保护
            - 保留提交不确定状态、崩溃恢复及补打印审批链
            - 保持 BarTender COM 打印接口和独立预览宿主兼容

            #### 安全与合规
            - 保留 SQLite 打印权威账本、补打印审批和历史完整性校验
            - 固定使用坚果云官方 HTTPS WebDAV 地址并验证协作空间身份
            - 发布制品排除连接文件、同步配置、数据库、模板缓存、设备私钥、诊断和日志

            #### 测试与发布
            - Linux CI 验证跨平台打印可靠性测试
            - Windows CI 验证 WinForms、同步协议、直连、BarTender 边界和自包含发布
            - 发布制品自动扫描同步凭据、连接文件、证书私钥和运行时业务数据

            ### 系统要求
            - Windows 10/11 x64
            - .NET 8.0 运行时（已内置，无需额外安装）
            - BarTender 2022 R2 Automation 或 Enterprise x64

            ### 安装说明
            1. 下载 `BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe`
            2. 运行安装向导
            3. 从开始菜单或桌面快捷方式启动软件

            ### 文件信息
            - 文件名: BarTenderPrinter-Setup-${{ steps.version.outputs.TAG }}-win-x64.exe
            - 架构: win-x64
            - 类型: 当前用户范围自包含安装包
          generate_release_notes: false
          draft: false
          prerelease: false
