name: Build C# BarTender Printer

on:
  push:
    branches: [ main ]
    paths:
      - 'BarTenderPrinter/**'
      - 'BarTenderPrinter.Tests/**'
      - 'BarTenderPreviewHost/**'
      - 'BarTenderPrinter.Domain/**'
      - 'BarTenderPrinter.Domain.Tests/**'
      - 'BarTenderPrinter.Application/**'
      - 'BarTenderPrinter.Application.Tests/**'
      - 'BarTenderPrinter.Devices/**'
      - 'BarTenderPrinter.Devices.Tests/**'
      - 'BarTenderPrinter.Persistence/**'
      - 'BarTenderPrinter.Persistence.Tests/**'
      - 'BarTenderPrinter.MesApi/**'
      - 'BarTenderPrinter.MesApi.Tests/**'
      - 'BarTenderPrinter.MesWeb/**'
      - 'BarTenderPrinter.StationAgent/**'
      - 'BarTenderPrinter.StationAgent.Tests/**'
      - 'BarTenderPrinter.MesClient.Tests/**'
      - 'BarTenderPrinter.Printing.Tests/**'
      - 'installer/**'
      - 'scripts/Test-ReleaseArtifact.ps1'
      - '.github/workflows/build-csharp.yml'
      - '.github/workflows/release-csharp.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'BarTenderPrinter/**'
      - 'BarTenderPrinter.Tests/**'
      - 'BarTenderPreviewHost/**'
      - 'BarTenderPrinter.Domain/**'
      - 'BarTenderPrinter.Domain.Tests/**'
      - 'BarTenderPrinter.Application/**'
      - 'BarTenderPrinter.Application.Tests/**'
      - 'BarTenderPrinter.Devices/**'
      - 'BarTenderPrinter.Devices.Tests/**'
      - 'BarTenderPrinter.Persistence/**'
      - 'BarTenderPrinter.Persistence.Tests/**'
      - 'BarTenderPrinter.MesApi/**'
      - 'BarTenderPrinter.MesApi.Tests/**'
      - 'BarTenderPrinter.MesWeb/**'
      - 'BarTenderPrinter.StationAgent/**'
      - 'BarTenderPrinter.StationAgent.Tests/**'
      - 'BarTenderPrinter.MesClient.Tests/**'
      - 'BarTenderPrinter.Printing.Tests/**'
      - 'installer/**'
      - 'scripts/Test-ReleaseArtifact.ps1'
      - '.github/workflows/build-csharp.yml'
      - '.github/workflows/release-csharp.yml'
  workflow_dispatch:

concurrency:
  group: build-csharp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux-service:
    name: Linux center service and cross-platform tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bartender_ci
          POSTGRES_USER: bartender_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bartender_ci -d bartender_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BARTENDER_TEST_POSTGRES: Host=localhost;Port=5432;Database=bartender_ci;Username=bartender_ci
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MES Web toolchain
        shell: bash
        run: |
          npm install -g react@19.1.1 react-dom@19.1.1 react-router-dom@7.18.2 @mui/material@7.3.2 @mui/icons-material@7.3.2 @emotion/react@11.14.0 @emotion/styled@11.14.1 typescript@5.9.2 vite@7.1.5 @vitejs/plugin-react@5.0.2 vitest@3.2.4 jsdom@26.1.0 @testing-library/react@16.3.0 @testing-library/jest-dom@6.8.0 @types/react@19.1.12 @types/react-dom@19.1.9
          ln -s "$(npm root -g)" BarTenderPrinter.MesWeb/node_modules

      - name: Test and build MES Web
        shell: bash
        run: |
          npm --prefix BarTenderPrinter.MesWeb test
          npm --prefix BarTenderPrinter.MesWeb run build

      - name: Run cross-platform tests
        shell: bash
        run: |
          dotnet test BarTenderPrinter.Domain.Tests/BarTenderPrinter.Domain.Tests.csproj -c Release
          dotnet test BarTenderPrinter.Application.Tests/BarTenderPrinter.Application.Tests.csproj -c Release
          dotnet test BarTenderPrinter.StationAgent.Tests/BarTenderPrinter.StationAgent.Tests.csproj -c Release
          dotnet test BarTenderPrinter.Devices.Tests/BarTenderPrinter.Devices.Tests.csproj -c Release
          dotnet test BarTenderPrinter.Printing.Tests/BarTenderPrinter.Printing.Tests.csproj -c Release
          dotnet test BarTenderPrinter.MesClient.Tests/BarTenderPrinter.MesClient.Tests.csproj -c Release
          dotnet test BarTenderPrinter.Persistence.Tests/BarTenderPrinter.Persistence.Tests.csproj -c Release
          dotnet test BarTenderPrinter.MesApi.Tests/BarTenderPrinter.MesApi.Tests.csproj -c Release

      - name: Build center service
        run: |
          dotnet build BarTenderPrinter.MesApi/BarTenderPrinter.MesApi.csproj -c Release
          dotnet build BarTenderPrinter.StationAgent/BarTenderPrinter.StationAgent.csproj -c Release

  build-windows:
    name: Windows WinForms and BarTender tests
    needs: test-linux-service
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test BarTenderPrinter.Tests/BarTenderPrinter.Tests.csproj -c Release

      - name: Publish self-contained application
        run: dotnet publish BarTenderPrinter/BarTenderPrinter.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Verify release artifact contents
        shell: pwsh
        run: ./scripts/Test-ReleaseArtifact.ps1 -PublishDirectory publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "installer/BarTenderPrinter.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "installer-output/BarTenderPrinter-Setup-*-win-x64.exe" | Select-Object -First 1
          if (!$installer -or $installer.Length -le 0) {
            throw "Installer was not generated"
          }
          Write-Host "Installer: $($installer.Name), Size: $($installer.Length) bytes"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: bartender-printer-installer
          path: installer-output/BarTenderPrinter-Setup-*-win-x64.exe
          if-no-files-found: error
