name: Core Functionality Test

on:
  push:
    branches: [ main ]
    paths:
      - 'BarTenderPrinter/**'
      - 'BarTenderPrinter.Tests/**'
      - 'scripts/Test-ReleaseArtifact.ps1'
      - '.github/workflows/test-core.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'BarTenderPrinter/**'
      - 'BarTenderPrinter.Tests/**'
      - 'scripts/Test-ReleaseArtifact.ps1'
      - '.github/workflows/test-core.yml'
  workflow_dispatch:

jobs:
  test-core:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run core unit tests
        run: dotnet test BarTenderPrinter.Tests/BarTenderPrinter.Tests.csproj -c Release --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults

      - name: Upload core test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Publish application
        run: dotnet publish BarTenderPrinter/BarTenderPrinter.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Verify release artifact contents
        shell: pwsh
        run: ./scripts/Test-ReleaseArtifact.ps1 -PublishDirectory publish

      - name: Verify current history storage and unconfigured sync startup
        shell: pwsh
        run: |
          $pathsSource = Get-Content "BarTenderPrinter/AppPaths.cs" -Raw
          if ($pathsSource -notmatch 'RecordsJsonlFile' -or $pathsSource -notmatch 'RecordsSqliteFile') {
            throw "Current JSONL and SQLite history paths are not compiled into the application"
          }
          $syncSource = Get-Content "BarTenderPrinter/SyncApplicationService.cs" -Raw
          if ($syncSource -notmatch '(?s)catch \(Exception ex\).*?_profile = null' -or
              $syncSource -notmatch '(?s)if \(_profile\?\.DirectSyncEnabled != true\)\s*\{\s*await StopDirectHostAsync\(\).*?return;') {
            throw "Unconfigured synchronization startup no longer remains offline"
          }
          $assemblyBytes = [System.IO.File]::ReadAllBytes("publish/BarTenderPrinter.dll")
          $assemblyContent = [System.Text.Encoding]::ASCII.GetString($assemblyBytes) +
            [System.Text.Encoding]::Unicode.GetString($assemblyBytes)
          foreach ($marker in @("print_records.jsonl", "print_records.db", "SyncApplicationService", "DirectSyncHost")) {
            if ($assemblyContent -notmatch [regex]::Escape($marker)) {
              throw "Compiled application is missing required marker: $marker"
            }
          }
